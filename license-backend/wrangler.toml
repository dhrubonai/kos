name = "kos-license"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV namespace: create with
#   curl -X POST "https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/storage/kv/namespaces" \
#        -H "Authorization: Bearer <TOKEN>" -H "Content-Type: application/json" \
#        -d '{"title":"kos_licenses"}'
# then paste the returned id below:
kv_namespaces = [
  { binding = "KOS_LICENSES", id = "PASTE_KV_NAMESPACE_ID_HERE" }
]

# Secret:
#   curl -X PUT "https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/workers/scripts/kos-license/secrets" \
#        -H "Authorization: Bearer <TOKEN>" -H "Content-Type: application/json" \
#        -d '{"name":"ADMIN_PASSWORD","text":"<your-admin-password>","type":"secret_text"}'
